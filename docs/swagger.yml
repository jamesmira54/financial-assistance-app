openapi: 3.0.3
info:
  title: Financial Assistance Application API
  version: 1.0.0
  description: This API enables the management and processing of financial assistance applications.
    It allows students to apply for grants, and provides system admins and other roles access to manage and track the status of applications.
    The API supports roles such as students, financial assistance coordinators, and various offices responsible for managing the budget, processing payments, and approving grants.
    Key features include application submission, status updates, and administrative control over grant approvals and disbursements.
servers:
  - url: 'https://{environment}/api/v1'
    description: Server url
tags:
  - name: Authentication
    description: Endpoints for user authentication.
  - name: Student
    description: Endpoints for student information management
  - name: File Upload
    description: Endpoints for file upload
  - name: User
    description: Endpoints for User management
  - name: Announcement
    description: Endpoints for User announcement
  - name: Address
    description: Endpoints for Address
  - name: Role
    description: Endpoints for Role
  - name: School
    description: Endpoints for School
  - name: Coordinator Sponsorship
    description: Endpoints for Coordinator Sponsorship
  - name: Student Sponsorship
    description: Endpoints for Student Sponsorship
  - name: Schedule
    description: Endpoints for interview/exam schedule
  - name: Academic Year
    description: Endpoints for academic year management
  - name: Dashboard
    description: Endpoints for dashboard statistics
  - name: Resources
    description: Endpoints for downloadable resources
  - name: Notifications
    description: Endpoints for user notifications
  - name: FAQ
    description: Endpoints for frequently asked questions
  - name: Static Content
    description: Endpoints for static content management (About Us, Contact Us)
security:
  - BearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPayload'
      responses:
        '201':
          description: Resource successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /auth/student/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
