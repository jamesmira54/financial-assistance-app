              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@gmail.com
              required:
                - email
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Password reset email sent successfully
                  generatedAt:
                    type: integer
                    example: 1738335123028
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                password:
                  type: string
                  example: newPassword123
              required:
                - token
                - password
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Password successfully reset
                  generatedAt:
                    type: integer
                    example: 1738335123028
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /auth/validate-reset-token/{token}:
    get:
      tags:
        - Authentication
      summary: Validate a password reset token
      parameters:
        - name: token
          in: path
          required: true
          description: The password reset token to validate
          schema:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Token is valid
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                  generatedAt:
                    type: integer
                    example: 1738335123028
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /students:
    get:
      tags:
        - Student
      summary: Get all students
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term for filtering users
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
          description: Number of records to skip
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Maximum number of records to return
      responses:
        '200':
          description: A list of students
