      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                fileTypeId:
                  type: number
                  example: 1
      responses:
        '201':
          description: File Succesfully saved
