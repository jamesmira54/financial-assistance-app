openapi: 3.0.3
info:
  title: "Student API"
  version: "1.0.0"
  description: "API documentation for the student module — generated by sync-dev-tdd"

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Student"
    description: "Student records and reference lookups"

paths:
  /students/academic-strands:
    get:
      tags: ["Student"]
      summary: "List allowed Senior High School academic strands"
      description: >
        Returns the fixed set of values accepted by the `g12AcademicStrand`
        field on student create/update. The frontend strand dropdown should be
        sourced from this endpoint so it stays in sync with backend validation.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Request Successfully Accepted!"
                  data:
                    type: array
                    items:
                      type: string
                      enum: [ABM, STEM, HUMSS, GAS, TVL]
                    example: [ABM, STEM, HUMSS, GAS, TVL]
                  generatedAt:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: >
        Invalid or missing token. Note: this codebase returns HTTP 400 (not 401)
        from the authentication middleware via ResponseHandler.forbidden.
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
                example: "FORBIDDEN"
              description:
                type: string
