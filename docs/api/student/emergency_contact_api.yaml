openapi: 3.0.3
info:
  title: "Student API — Emergency Contact"
  version: "1.0.0"
  description: >-
    API documentation for the emergency-contact fields of the student module —
    generated by sync-dev-tdd. A student now has exactly ONE emergency contact,
    with a user-inputted relationship. The former second emergency contact
    (emergencyContactName2 / emergencyContactNumber2) has been removed from the
    request and response contract.

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Student"
    description: "Student registration and profile, including the single emergency contact."

paths:
  /students/{studentId}:
    put:
      tags: ["Student"]
      summary: "Update student (incl. emergency contact)"
      description: >-
        Updates a student profile. Emergency-contact fields are all optional;
        emergencyContactRelationship is a free-text value.
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdateRequest"
      responses:
        "200":
          description: "Updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      tags: ["Student"]
      summary: "Get one student (incl. emergency contact)"
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmergencyContact:
      type: object
      description: "The student's single emergency contact."
      properties:
        emergencyContactName:
          type: string
          nullable: true
          example: Jane Doe
        emergencyContactNumber:
          type: string
          nullable: true
          example: "+639938172631"
        emergencyContactRelationship:
          type: string
          nullable: true
          description: "Free-text, user-inputted relationship to the student."
          example: Mother

    StudentUpdateRequest:
      type: object
      description: "Partial update. Only emergency-contact fields shown; all optional."
      properties:
        emergencyContactName:
          type: string
          example: Jane Doe
        emergencyContactNumber:
          type: string
          example: "+639938172631"
        emergencyContactRelationship:
          type: string
          description: "Must be a string when provided (validation: EMERGENCY_CONTACT_RELATIONSHIP_INVALID)."
          example: Mother

    StudentDetail:
      type: object
      description: "Student detail response. Only emergency-contact fields shown."
      properties:
        emergencyContactName:
          type: string
          example: Jane Doe
        emergencyContactNumber:
          type: string
          example: "+639938172631"
        emergencyContactRelationship:
          type: string
          nullable: true
          example: Mother

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
                example: INVALID-REQUEST
              description:
                type: string
              errorDetails:
                type: object

    Unauthorized:
      description: "Unauthenticated - valid token required"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    Forbidden:
      description: "Forbidden - insufficient role permissions"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
