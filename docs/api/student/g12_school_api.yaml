openapi: 3.0.3
info:
  title: "Student API — Grade 12 School"
  version: "1.0.0"
  description: >-
    API documentation for the Grade 12 school field of the student module —
    generated by sync-dev-tdd. The G12 school is now a free-text value typed by
    the student (g12SchoolName). It is no longer a dropdown / FK selection from
    the school table, so there is no server-side existence check. The former
    g12SchoolId (UUID) has been removed from the request and response contract.
    Scope is G12 only — the college school remains an FK-backed selection.

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Student"
    description: "Student registration and profile, including the free-text Grade 12 school."

paths:
  /students:
    post:
      tags: ["Student"]
      summary: "Register student (incl. free-text G12 school)"
      description: >-
        Creates a student. g12SchoolName is optional free text; when provided it
        must be a string. No lookup against the school table is performed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentCreateRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /students/{studentId}:
    put:
      tags: ["Student"]
      summary: "Update student (incl. free-text G12 school)"
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdateRequest"
      responses:
        "200":
          description: "Updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      tags: ["Student"]
      summary: "Get one student (incl. free-text G12 school)"
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    G12SchoolField:
      type: object
      description: "Grade 12 school as free text."
      properties:
        g12SchoolName:
          type: string
          nullable: true
          description: >-
            Free-text school name typed by the student. Must be a string when
            provided (validation: G12_SCHOOL_NAME_INVALID). No existence check.
          example: Davao City National High School

    StudentCreateRequest:
      type: object
      description: "Only the G12 school field is shown; it is optional."
      properties:
        g12SchoolName:
          type: string
          example: Davao City National High School

    StudentUpdateRequest:
      type: object
      description: "Partial update. Only the G12 school field shown; optional."
      properties:
        g12SchoolName:
          type: string
          example: Davao City National High School

    StudentDetail:
      type: object
      description: "Student detail response. Only the G12 school field shown."
      properties:
        g12SchoolName:
          type: string
          nullable: true
          example: Davao City National High School

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
                example: INVALID-REQUEST
              description:
                type: string
              errorDetails:
                type: object

    Unauthorized:
      description: "Unauthenticated - valid token required"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    Forbidden:
      description: "Forbidden - insufficient role permissions"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
