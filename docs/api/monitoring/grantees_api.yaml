openapi: 3.0.3
info:
  title: "Monitoring API"
  version: "1.0.0"
  description: >
    Grantee Monitoring List - generated by sync-dev-tdd. Lists post-award grantees
    and moves a grantee through the post-award lifecycle. The stored status
    AWARDED doubles as "Active" (Awarded == Active) and is presented as ACTIVE in
    the list; DELISTED and GRADUATED are the other lifecycle states. No existing
    data is migrated.

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Monitoring"
    description: "Grantee monitoring list and lifecycle transitions"

paths:
  /monitoring/grantees:
    get:
      tags: ["Monitoring"]
      summary: "List grantees (admin/coordinator all; sponsor scoped to own)"
      description: >
        Returns the grantee monitoring list. System admin and financial assistance coordinator
        see every grantee; a sponsor sees only grantees under sponsorships they own; students are
        forbidden. Supports filtering by lifecycle type, scholarship name, and academic year, with
        offset/limit pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: "Lifecycle filter. `all` (default) returns ACTIVE+DELISTED+GRADUATED."
          schema:
            type: string
            enum: [all, active, delisted, graduated]
            default: all
        - name: search
          in: query
          required: false
          description: "Case-insensitive scholarship name match (contains)."
          schema:
            type: string
        - name: academic_year_id
          in: query
          required: false
          description: "Filter by the sponsorship's academic year (UUID)."
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GranteeListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /monitoring/grantees/{applicationId}/status:
    put:
      tags: ["Monitoring"]
      summary: "Transition a grantee (ACTIVE -> DELISTED/GRADUATED)"
      description: >
        Moves an ACTIVE grantee to DELISTED or GRADUATED. Only system admin and financial
        assistance coordinator may call this. `remarks` is required when delisting. The grantee
        must currently be ACTIVE; reinstatement is not supported here.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          description: "The sponsorshipApplication UUID."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GranteeStatusChangeRequest"
      responses:
        "200":
          description: "Updated"
        "400":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GranteeListResponse:
      type: object
      properties:
        totalCount:
          type: integer
        grantees:
          type: array
          items:
            $ref: "#/components/schemas/GranteeRow"

    GranteeRow:
      type: object
      properties:
        seq:
          type: integer
          description: "1-based row number across the paginated result."
        awardNumber:
          type: string
          nullable: true
        grantName:
          type: string
          description: "Scholarship name (carries the TDP/TES distinction)."
        batch:
          type: integer
          nullable: true
        semester:
          type: integer
          nullable: true
          description: "academicYear.school_term."
        studentId:
          type: string
          nullable: true
          description: "For deep-linking the award number to the student profile."
        completeName:
          type: string
          description: "Formatted 'Last, First Middle Ext'."
        gender:
          type: string
          nullable: true
        yearLevel:
          type: integer
          nullable: true
        course:
          type: string
          nullable: true
        school:
          type: string
          nullable: true
        gwa:
          type: number
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DELISTED, GRADUATED]

    GranteeStatusChangeRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [DELISTED, GRADUATED]
        remarks:
          type: string
          description: "Required when status is DELISTED."

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
              errorDetails:
                type: object
