openapi: 3.0.3
info:
  title: "Schedule API — Interview Schedule Management"
  version: "1.0.0"
  description: >-
    API documentation for the schedule module (exam/interview scheduling) — generated by
    sync-dev-tdd. This revision adds three coordinator-entered fields to create/update:
    batchCode (free text), examinationType (ONSITE/ONLINE, required on every schedule), and
    proctorInterviewer (single free-text name). The by-id endpoints (update/get-one/delete)
    were also fixed to read the scheduleId path param correctly.

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Schedule"
    description: "Exam/interview schedule CRUD for coordinators."

paths:
  /schedules:
    post:
      tags: ["Schedule"]
      summary: "Create schedule"
      description: >-
        Creates a schedule. batchCode, examinationType, and proctorInterviewer are required
        (in addition to the pre-existing fields). Roles: system admin, financial assistance
        coordinator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: ["Schedule"]
      summary: "List schedules"
      description: "Paginated list. (Note: search on non-string columns is a known, separate defect.)"
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /schedules/{scheduleId}:
    get:
      tags: ["Schedule"]
      summary: "Get one schedule"
      security:
        - bearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: ["Schedule"]
      summary: "Update schedule"
      description: "Roles: system admin, financial assistance coordinator."
      security:
        - bearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "200":
          description: "Updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: ["Schedule"]
      summary: "Delete schedule (soft delete)"
      description: "Roles: system admin, financial assistance coordinator."
      security:
        - bearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ScheduleRequest:
      type: object
      required:
        - sponsorshipId
        - batchNo
        - batchCode
        - scheduleType
        - examinationType
        - proctorInterviewer
        - location
        - scheduleQuota
        - startDate
        - endDate
      properties:
        sponsorshipId:
          type: string
          format: uuid
        batchNo:
          type: integer
          example: 1
        batchCode:
          type: string
          description: "Free-text batch code entered by the coordinator."
          example: BATCH-2026-A
        scheduleType:
          type: string
          enum: [TEST, INTERVIEW]
          description: "UI label 'Exam' maps to stored value TEST."
          example: TEST
        examinationType:
          type: string
          enum: [ONSITE, ONLINE]
          description: "Modality; required on every schedule (exam and interview)."
          example: ONSITE
        proctorInterviewer:
          type: string
          description: "Single proctor/interviewer name, user-inputted."
          example: Prof. Reyes
        location:
          type: string
          example: Room 101
        scheduleQuota:
          type: integer
          minimum: 1
          example: 30
        startDate:
          type: string
          format: date-time
          example: 2026-08-01T09:00:00.000Z
        endDate:
          type: string
          format: date-time
          example: 2026-08-01T11:00:00.000Z

    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sponsorshipId:
          type: string
          format: uuid
        sponsorshipName:
          type: string
          nullable: true
        batchNo:
          type: integer
        batchCode:
          type: string
          nullable: true
          description: "Null for legacy schedules created before this field existed."
        scheduleType:
          type: string
          enum: [TEST, INTERVIEW]
        examinationType:
          type: string
          enum: [ONSITE, ONLINE]
          nullable: true
        proctorInterviewer:
          type: string
          nullable: true
        location:
          type: string
        scheduleQuota:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
                example: INVALID-REQUEST
              description:
                type: string
              errorDetails:
                type: object

    Unauthorized:
      description: "Unauthenticated - valid token required"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    Forbidden:
      description: "Forbidden - insufficient role permissions"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
