openapi: 3.0.3
info:
  title: "Sponsorship API"
  version: "1.0.0"
  description: >
    Sponsorship "All Schools" behavior - generated by sync-dev-tdd.
    An empty or omitted sponsorshipSchool list means the sponsorship applies to ALL schools
    (current and future) and is visible to every student.

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Sponsorship"
    description: "Coordinator sponsorship management and student-available listing"

paths:
  /sponsorships/coordinator:
    post:
      tags: ["Sponsorship"]
      summary: "Create a sponsorship (coordinator/admin)"
      description: >
        Creates a sponsorship. `sponsorshipSchool` is OPTIONAL: an empty array `[]` or an omitted
        field scopes the sponsorship to ALL schools. A non-empty list must contain valid,
        existing, active school IDs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipCreateRequest"
      responses:
        "201":
          description: "Created"
        "400":
          $ref: "#/components/responses/ValidationError"

  /sponsorships/coordinator/{sponsorshipId}:
    put:
      tags: ["Sponsorship"]
      summary: "Update a sponsorship (coordinator/admin)"
      description: >
        Updates a sponsorship. Same `sponsorshipSchool` rules as create. Editing the list down to
        empty flips the sponsorship to "all schools" (existing school links are replaced).
      security:
        - bearerAuth: []
      parameters:
        - name: sponsorshipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipCreateRequest"
      responses:
        "200":
          description: "Updated"
        "400":
          $ref: "#/components/responses/ValidationError"

  /sponsorships/student/available:
    get:
      tags: ["Sponsorship"]
      summary: "List sponsorships available to the logged-in student"
      description: >
        Returns ACTIVE sponsorships visible to the student. A student always sees all-schools
        sponsorships (those with no schools attached); a student with a college school also sees
        sponsorships scoped to that school. A student without a college school sees only
        all-schools sponsorships.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SponsorshipCreateRequest:
      type: object
      required:
        - name
        - batchNumber
        - sponsorId
        - academicYearId
        - durationFrom
        - durationTo
        - limit
        - slot
        - fundAllocation
      properties:
        name:
          type: string
        batchNumber:
          type: integer
        sponsorId:
          type: string
        academicYearId:
          type: string
        durationFrom:
          type: string
          format: date-time
        durationTo:
          type: string
          format: date-time
        limit:
          type: integer
          minimum: 1
        slot:
          type: integer
          minimum: 1
        fundAllocation:
          type: number
          minimum: 0.01
        sponsorshipSchool:
          type: array
          description: >
            Optional. Empty array or omitted = ALL schools. Non-empty = list of valid school IDs.
          items:
            type: string
          example: []

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
              errorDetails:
                type: object
