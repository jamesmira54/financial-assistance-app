openapi: 3.0.3
info:
  title: "Sponsorship API — Allowance per Student"
  version: "1.0.0"
  description: >-
    API documentation for the allowancePerStudent field of the sponsorship module —
    generated by sync-dev-tdd. When creating (or updating) a sponsorship, the coordinator
    enters allowancePerStudent alongside fundAllocation. It is an independent monetary
    input (no cross-field rule against fundAllocation). Required at the API layer
    (isFloat, min 0.01). The underlying column is nullable so existing sponsorships that
    predate the feature read back null.

servers:
  - url: "/api/v1"
    description: "Application API base"

tags:
  - name: "Sponsorship"
    description: "Coordinator sponsorship management, including per-student allowance."

paths:
  /sponsorship/coordinator:
    post:
      tags: ["Sponsorship"]
      summary: "Create sponsorship (incl. allowance per student)"
      description: >-
        Creates a sponsorship. allowancePerStudent is required and must be greater than 0.
        Roles: system admin, financial assistance coordinator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipCreateRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsorship"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sponsorship/coordinator/{sponsorshipId}:
    put:
      tags: ["Sponsorship"]
      summary: "Update sponsorship (incl. allowance per student)"
      description: >-
        Updates a sponsorship. allowancePerStudent is validated the same as on create
        (required, greater than 0). Roles: system admin, financial assistance coordinator.
      security:
        - bearerAuth: []
      parameters:
        - name: sponsorshipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipCreateRequest"
      responses:
        "200":
          description: "Updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsorship"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      tags: ["Sponsorship"]
      summary: "Get one sponsorship (incl. allowance per student)"
      security:
        - bearerAuth: []
      parameters:
        - name: sponsorshipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsorship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SponsorshipCreateRequest:
      type: object
      description: "Only the money fields are shown; both are required and must be greater than 0."
      required:
        - fundAllocation
        - allowancePerStudent
      properties:
        fundAllocation:
          type: number
          description: "Total fund allocation for the sponsorship."
          example: 100000
        allowancePerStudent:
          type: number
          description: >-
            Monetary allowance granted per student, entered by the coordinator.
            Independent of fundAllocation (no cross-field consistency rule).
            Validation: allowancePerStudent must be greater than 0.
          example: 1500

    Sponsorship:
      type: object
      description: "Sponsorship detail response. Only the money fields are shown."
      properties:
        fundAllocation:
          type: number
          example: 100000
        allowancePerStudent:
          type: number
          nullable: true
          description: "Null for legacy sponsorships created before this field existed."
          example: 1500

  responses:
    ValidationError:
      description: "Validation failed"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
                example: INVALID-REQUEST
              description:
                type: string
              errorDetails:
                type: object

    Unauthorized:
      description: "Unauthenticated - valid token required"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    Forbidden:
      description: "Forbidden - insufficient role permissions"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string

    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
